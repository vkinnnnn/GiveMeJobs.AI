[pytest]
# Pytest configuration for MCP servers tests

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (moderate speed)
    property: Property-based tests (comprehensive)
    slow: Slow running tests

# Async support
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-report=html:tests/coverage
    --cov-report=xml:tests/coverage.xml
    --cov-fail-under=80
    -p no:warnings

# Coverage settings
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */workflows/*
    */memory_population.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = tests/coverage
